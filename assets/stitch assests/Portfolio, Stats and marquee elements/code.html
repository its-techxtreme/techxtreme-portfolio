<script>
        // Optional micro-interaction: Subtle parallax on cards based on mouse position
        const cards = document.querySelectorAll('.group');
        const section = document.querySelector('section');

        section.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const cardCenterX = rect.left + rect.width / 2;
                const cardCenterY = rect.top + rect.height / 2;
                
                const deltaX = (clientX - cardCenterX) * 0.02;
                const deltaY = (clientY - cardCenterY) * 0.02;
                
                card.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0)`;
            });
        });

        section.addEventListener('mouseleave', () => {
            cards.forEach(card => {
                card.style.transform = `translate3d(0, 0, 0)`;
                if(card.classList.contains('stat-card-glow')) {
                    card.style.transform = `translate3d(0, -8px, 0)`;
                }
            });
        });
    </script>
