<body class="bg-surface-container-lowest min-h-screen flex items-center justify-center p-4">
<!-- Showcase Canvas -->
<div class="relative w-full max-w-[800px] h-[600px] flex flex-col items-center justify-center overflow-hidden rounded-xl bg-gradient-to-br from-[#1c1410] to-[#0f0f12] shadow-2xl">
<!-- Ambient Background Layers -->
<div class="absolute inset-0 grid-texture pointer-events-none"></div>
<div class="absolute inset-0 orange-glow pointer-events-none"></div>
<!-- Techxtreme Glass Card -->
<div class="glass-container relative z-10 w-11/12 md:w-3/4 p-12 flex flex-col items-center text-center rounded-2xl border border-white/10 transition-transform duration-500 hover:scale-[1.01]">
<!-- Centered Logo Section -->

<img alt="JEE Notes Wallah Logo" class="w-48 h-auto object-contain drop-shadow-[0_0_30px_rgba(251,146,60,0.3)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDoMn52H_fQfA3-M_QqaSg-2k2_VdpaE1vk_zExHw433xztToPsTsMmCpU8grGalhw7tJMvF04LRVA5ZviGS-MYkdttnBYnCuQM4FBOF_ZX3JzgPnSxIKIRsNBi7MR080cJSGg1w_Mo_aW5Cxli6I7f5QlTgPCJTIRQFDN9hdJG_cfbaiQFksrdVO_DQUSPqs99JZAxkoaf8ieShc7vOENfgc8EJaMGG6BbGY7vSFh-rcDWOOW-FA3oU7c38qyFyOejzzJwoBvfxHuE"/>
</div>
<!-- Tagline -->

                    Notes for Toppers, By Toppers
                </p>
<div class="h-px w-24 bg-gradient-to-r from-transparent via-primary to-transparent mx-auto opacity-50"></div>
</div>
<!-- Monospace Feature Pills -->
<div class="flex flex-wrap justify-center gap-4">
<span class="px-6 py-2 rounded-full border border-white/5 bg-white/5 text-primary font-code-sm text-code-sm backdrop-blur-sm transition-all hover:bg-primary/10 hover:border-primary/20 cursor-default">
                    EdTech
                </span>
<span class="px-6 py-2 rounded-full border border-white/5 bg-white/5 text-primary font-code-sm text-code-sm backdrop-blur-sm transition-all hover:bg-primary/10 hover:border-primary/20 cursor-default">
                    Firebase
                </span>
<span class="px-6 py-2 rounded-full border border-white/5 bg-white/5 text-primary font-code-sm text-code-sm backdrop-blur-sm transition-all hover:bg-primary/10 hover:border-primary/20 cursor-default">
                    Prototype
                </span>
</div>
</div>
<!-- Atmospheric Accents -->
<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute -top-20 -right-20 w-64 h-64 bg-tertiary/5 rounded-full blur-[100px]"></div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-container');
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 30;
            const rotateY = (centerX - x) / 30;
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            const card = document.querySelector('.glass-container');
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>
