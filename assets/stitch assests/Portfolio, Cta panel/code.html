<!-- Floating Atmosphere Effects Script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const cyanOrb = document.querySelector('.orb-cyan');
            const violetOrb = document.querySelector('.orb-violet');
            
            if(cyanOrb && violetOrb) {
                cyanOrb.style.transform = `translate(${x * 30}px, ${y * 30}px)`;
                violetOrb.style.transform = `translate(${x * -40}px, ${y * -40}px)`;
            }
        });
    </script>
